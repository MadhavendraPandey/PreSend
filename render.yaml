services:
  - type: web
    name: presend-feedback
    runtime: python
    plan: free
    rootDir: feedback-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PRESEND_ALLOWED_EXTENSION_ORIGINS
        sync: false
